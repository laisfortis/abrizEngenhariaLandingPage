name: Histórico de alterações

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
      - 'fix/**'
      - 'refactor/**'

  pull_request:
    branches:
      - main
      - develop

jobs:
  registrar:
    runs-on: ubuntu-latest

    steps:
      - name: Mostrar informações do commit
        env:
          BRANCH: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
          AUTOR: ${{ github.actor }}
          MENSAGEM_COMMIT: ${{ github.event.head_commit.message }}
        run: |
          echo "Branch: $BRANCH"
          echo "Commit: $COMMIT_SHA"
          echo "Autor: $AUTOR"
          echo "Mensagem:"
          printf '%s\n' "$MENSAGEM_COMMIT"