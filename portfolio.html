<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portfólio | Abriz Engenharia</title>
<meta name="description" content="Confira algumas das obras entregues pela Abriz Engenharia.">
<link rel="stylesheet" href="css/pages/portfolio.css">
</head>
<body>

<header class="site-header">
  <div class="container" data-header></div>
</header>

<main>
  <section class="obras-grid" aria-label="Galeria de obras">
    <button class="obras-grid__item" data-obra="Edifício Anália Gold" data-data="2024" data-img="assets/img/EdificioAnaliaGoldVertic.png">
      <img src="assets/img/EdificioAnaliaGoldHoriz.png" alt="Foto da obra Edifício Anália Gold">
    </button>
    <button class="obras-grid__item" data-obra="Mar e Sol" data-data="2024">
      <img src="assets/img/MarESol-Depois.png" alt="Foto da obra Mar e Sol">
    </button>
    <button class="obras-grid__item" data-obra="Parque das Árvores" data-data="2023">
      <img src="assets/img/ParqueDasArvores-Depois.png" alt="Foto da obra Parque das Árvores">
    </button>
    <button class="obras-grid__item" data-obra="Residencial Maria Lourenço" data-data="2023" data-img="assets/img/ResidencialMariaLourenco2.png">
      <img src="assets/img/ResidencialMariaLourenco.png" alt="Foto da obra Residencial Maria Lourenço">
    </button>
    <button class="obras-grid__item" data-obra="Residencial Sol do Guarujá" data-data="2023">
      <img src="assets/img/ResidencialSolDoGuaruja.png" alt="Foto da obra Residencial Sol do Guarujá">
    </button>
    <button class="obras-grid__item" data-obra="Residencial Vila Funchal" data-data="2022">
      <img src="assets/img/ResidencialVilaFunchal.jpg" alt="Foto da obra Residencial Vila Funchal">
    </button>
    <button class="obras-grid__item" data-obra="Santo Onofre" data-data="2022">
      <img src="assets/img/SantoOnofre-Depois.png" alt="Foto da obra Santo Onofre">
    </button>
    <button class="obras-grid__item" data-obra="São Lucas V" data-data="2022">
      <img src="assets/img/SaoLucasV-Depois.png" alt="Foto da obra São Lucas V">
    </button>
    <button class="obras-grid__item" data-obra="São Lucas 3" data-data="2021">
      <img src="assets/img/S%C3%A3o%20Lucas%203%20-%20DEPOIS%202.jpg" alt="Foto da obra São Lucas 3">
    </button>
  </section>

  <div class="container text-center" style="padding: 40px 0;">
    <h1 class="display-title display-title--yellow" style="opacity:1;">PORTFÓLIO</h1>
  </div>
</main>

<!-- Lightbox -->
<div class="lightbox" aria-hidden="true">
  <div class="lightbox__panel">
    <button class="lightbox__close" aria-label="Fechar">&times;</button>
    <div class="lightbox__photo">
      <img src="assets/img/servico-fachada.jpg" alt="Foto da obra selecionada">
      <button class="lightbox__nav lightbox__nav--prev" aria-label="Obra anterior">&#10094;</button>
      <button class="lightbox__nav lightbox__nav--next" aria-label="Próxima obra">&#10095;</button>
    </div>
    <div class="lightbox__info">
      <h3 data-lightbox-title>Obra:</h3>
      <p data-lightbox-date>Data:</p>
    </div>
  </div>
</div>

<footer class="site-footer" data-footer></footer>

<script type="module" src="js/pages/portfolio.js"></script>
</body>
</html>
