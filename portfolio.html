<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portfólio | Abriz Engenharia</title>
<meta name="description" content="Confira algumas das obras entregues pela Abriz Engenharia.">
<link rel="stylesheet" href="css/pages/portfolio.css">
</head>
<body>

<header class="site-header">
  <div class="container" data-header></div>
</header>

<main>
  <section class="obras-grid" aria-label="Galeria de obras">
    <button class="obras-grid__item" data-obra="Revitalização de fachada" data-data="2024"><span class="obras-grid__label">OBRA</span></button>
    <button class="obras-grid__item" data-obra="Pintura predial" data-data="2024"><span class="obras-grid__label">OBRA</span></button>
    <button class="obras-grid__item" data-obra="Manutenção estrutural" data-data="2023"><span class="obras-grid__label">OBRA</span></button>
    <button class="obras-grid__item" data-obra="Impermeabilização" data-data="2023"><span class="obras-grid__label">OBRA</span></button>
    <button class="obras-grid__item" data-obra="Reforma de fachada" data-data="2023"><span class="obras-grid__label">OBRA</span></button>
    <button class="obras-grid__item" data-obra="Pintura industrial" data-data="2022"><span class="obras-grid__label">OBRA</span></button>
    <button class="obras-grid__item" data-obra="Restauro predial" data-data="2022"><span class="obras-grid__label">OBRA</span></button>
    <button class="obras-grid__item" data-obra="Vistoria e reparo" data-data="2022"><span class="obras-grid__label">OBRA</span></button>
    <button class="obras-grid__item" data-obra="Pintura de fachada" data-data="2021"><span class="obras-grid__label">OBRA</span></button>
  </section>

  <div class="container text-center" style="padding: 40px 0;">
    <h1 class="display-title display-title--yellow" style="opacity:1;">PORTFÓLIO</h1>
  </div>
</main>

<!-- Lightbox -->
<div class="lightbox" aria-hidden="true">
  <div class="lightbox__panel">
    <button class="lightbox__close" aria-label="Fechar">&times;</button>
    <div class="lightbox__photo">
      <img src="assets/img/servico-fachada.jpg" alt="Foto da obra selecionada">
      <button class="lightbox__nav lightbox__nav--prev" aria-label="Obra anterior">&#10094;</button>
      <button class="lightbox__nav lightbox__nav--next" aria-label="Próxima obra">&#10095;</button>
    </div>
    <div class="lightbox__info">
      <h3 data-lightbox-title>Obra:</h3>
      <p data-lightbox-date>Data:</p>
    </div>
  </div>
</div>

<footer class="site-footer" data-footer></footer>

<script type="module" src="js/pages/portfolio.js"></script>
</body>
</html>
