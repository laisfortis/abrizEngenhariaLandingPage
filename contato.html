<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contato | Abriz Engenharia</title>
<meta name="description" content="Solicite um orçamento ou entre em contato com a Abriz Engenharia. Também estamos contratando — envie seu currículo.">
<link rel="stylesheet" href="css/pages/contato.css">
</head>
<body>

<header class="site-header">
  <div class="container" data-header></div>
</header>

<main>
  <section class="section" id="contato-intro">
    <div class="section__photo-bg-sobre" aria-hidden="true"></div>
    <div class="container container_nossos_servicos">

      <div class="contato-card">
        <div class="contato-card__form">
          <h2 style="color:var(--color-yellow); font-style:italic; font-weight:900; font-size:var(--fs-h1); margin-bottom:12px;">Solicite um orçamento</h2>
          <form data-form novalidate>
            <input type="hidden" name="subject" value="Novo pedido de orçamento — Site Abriz (Contato)">
            <input type="hidden" name="from_name" value="Site Abriz Engenharia">
            <input type="checkbox" name="botcheck" style="display:none" tabindex="-1" autocomplete="off">
            <div class="form-field">
              <label for="c-nome">Nome:</label>
              <input type="text" id="c-nome" name="nome" required>
            </div>
            <div class="form-field">
              <label for="c-telefone">Telefone:</label>
              <input type="tel" id="c-telefone" name="telefone" required>
            </div>
            <div class="form-field">
              <label for="c-email">E-mail:</label>
              <input type="email" id="c-email" name="email" required>
            </div>
            <div class="form-field">
              <label for="c-msg">Conte-nos sua necessidade:</label>
              <textarea id="c-msg" name="mensagem" required></textarea>
            </div>
            <button type="submit" class="btn">Enviar</button>
            <p class="form-feedback" role="status" hidden></p>
            <p class="form-or">ou</p>
            <a class="btn btn--whatsapp" href="https://wa.me/5511914651934?text=Ol%C3%A1!%20Gostaria%20de%20solicitar%20um%20or%C3%A7amento." target="_blank" rel="noopener">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M21 11.5a8.5 8.5 0 1 1-4.1-7.3L21 3l-1.2 4.1c.5 1 .8 2.2.8 3.4Z"/><path d="M8.5 9.5c0 3.5 2.5 6 6 6"/></svg>
              <span class="btn-label-full">Solicitar orçamento pelo WhatsApp</span>
              <span class="btn-label-short">WhatsApp</span>
            </a>
          </form>
        </div>

        <div class="contato-card__channels">
          <h3>Ou entre em contato pelos nossos canais:</h3>
          <div class="channel-item"><span>+55 11 91465-1934</span></div>
          <div class="channel-item"><span>contato@abrizengenharia.com.br</span></div>
          <div class="channel-item"><span>@abrizengenharia</span></div>
        </div>
      </div>

      <p class="display-title display-title--yellow contato-bg-title" aria-hidden="true">CONTATO</p>

      <div class="trabalhe-card">
        <div>
          <h3>Quer trabalhar com a gente?</h3>
          <p class="trabalhe-card__lead">Envie seu currículo!</p>
          <form data-form novalidate enctype="multipart/form-data">
            <input type="hidden" name="subject" value="Novo currículo recebido — Site Abriz">
            <input type="hidden" name="from_name" value="Site Abriz Engenharia">
            <input type="checkbox" name="botcheck" style="display:none" tabindex="-1" autocomplete="off">
            <div class="form-field">
              <label for="t-nome">Nome:</label>
              <input type="text" id="t-nome" name="nome" required>
            </div>
            <div class="form-field">
              <label for="t-telefone">Telefone:</label>
              <input type="tel" id="t-telefone" name="telefone" required>
            </div>
            <div class="form-field">
              <label for="t-email">E-mail:</label>
              <input type="email" id="t-email" name="email" required>
            </div>
            <div class="form-field form-field--file">
              <label for="t-curriculo">Anexe seu currículo abaixo:</label>
              <input type="file" id="t-curriculo" name="curriculo" accept=".pdf,.doc,.docx">
            </div>
            <button type="submit" class="btn btn--gray">Enviar</button>
            <p class="form-feedback" role="status" hidden></p>
          </form>
        </div>
        <div class="photo">
          <img src="assets/img/servico-fachada-orcamento.jpg" alt="Foto de obra da Abriz Engenharia">
        </div>
      </div>

    </div>
  </section>
</main>

<footer class="site-footer" data-footer></footer>

<script type="module" src="js/pages/contato.js"></script>
</body>
</html>
